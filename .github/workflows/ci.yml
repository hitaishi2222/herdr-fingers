name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich ruff

      - name: Syntax check
        run: python -m compileall -q herdr_fingers.py

      # Errors only: undefined names, syntax problems, f-string mistakes.
      # Style is left to the author.
      - name: Lint (errors only)
        run: ruff check --select=E9,F63,F7,F82,F401 --ignore=F401 .
