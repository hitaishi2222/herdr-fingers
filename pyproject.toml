[project]
name = "herdr-fingers"
version = "0.1.0"
description = "Pick file paths, URLs, IPs, UUIDs and hashes out of the focused terminal pane"
authors = [ { name = "Dr. Hitaishi V", email = "hitaishi2222@gmail.com" }, ]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["herdr", "terminal", "tmux", "fzf", "clipboard"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=15.0.0",
]
